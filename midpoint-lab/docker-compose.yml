# Lab midPoint local : dérivé du docker-compose.yml officiel d'Evolveum
# (https://github.com/Evolveum/midpoint-docker), avec :
#   - la version figée dans .env (MP_VER), pas « latest » ;
#   - le mot de passe de la base généré dans .env, pas le mot de passe public d'exemple ;
#   - le dossier ./data monté dans le conteneur, pour y lire (et écrire) des CSV.
services:
  midpoint_data:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_USER=midpoint
      - POSTGRES_INITDB_ARGS=--lc-collate=en_US.utf8 --lc-ctype=en_US.utf8
    networks: [net]
    volumes:
      - midpoint_data:/var/lib/postgresql/data

  data_init:
    image: evolveum/midpoint:${MP_VER}-alpine
    command: >
      bash -c "
      cd /opt/midpoint ;
      bin/midpoint.sh init-native ;
      echo ' - - - - - - ' ;
      bin/ninja.sh -B info >/dev/null 2>/tmp/ninja.log ;
      grep -q \"ERROR\" /tmp/ninja.log && (
      bin/ninja.sh run-sql --create --mode REPOSITORY  ;
      bin/ninja.sh run-sql --create --mode AUDIT
      ) ||
      echo -e '\\n Repository init is not needed...' ;
      "
    depends_on: [midpoint_data]
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=${DB_PASSWORD}
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_INIT_CFG=/opt/midpoint/var
    networks: [net]
    volumes:
      - midpoint_home:/opt/midpoint/var

  midpoint_server:
    image: evolveum/midpoint:${MP_VER}-alpine
    depends_on:
      data_init:
        condition: service_completed_successfully
      midpoint_data:
        condition: service_started
    command: ["/opt/midpoint/bin/midpoint.sh", "container"]
    ports:
      - "127.0.0.1:${MP_PORT:-8888}:8080"   # accessible uniquement depuis votre machine
    environment:
      - MP_SET_midpoint_repository_jdbcUsername=midpoint
      - MP_SET_midpoint_repository_jdbcPassword=${DB_PASSWORD}
      - MP_SET_midpoint_repository_jdbcUrl=jdbc:postgresql://midpoint_data:5432/midpoint
      - MP_SET_midpoint_repository_database=postgresql
      - MP_UNSET_midpoint_repository_hibernateHbm2ddl=1
      - MP_NO_ENV_COMPAT=1
    networks: [net]
    volumes:
      - midpoint_home:/opt/midpoint/var
      - ./data:/opt/midpoint/var/import   # CSV vus du conteneur : /opt/midpoint/var/import/...

networks:
  net:
    driver: bridge

volumes:
  midpoint_data:
  midpoint_home:
